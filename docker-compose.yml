version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accounting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - accounting_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_saas_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://accounting:password@postgres:5432/accounting_db
      - PG_POOL_MAX=20
      - PG_SSL=false
      - JWT_SECRET=ProductionSuperSecretKey_Accounting_SaaS_2026_Secure
      - JWT_EXPIRES_IN=7d
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - accounting_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/saas/plans"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: accounting_saas_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - accounting_net

  nginx:
    image: nginx:alpine
    container_name: accounting_saas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - accounting_net

volumes:
  postgres_data:
    driver: local

networks:
  accounting_net:
    driver: bridge
