events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # تنظیمات عملکردی و امنیتی
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    client_max_body_size 50M; # سقف مجاز آپلود اکسل و فاکتورها

    # هدرهای امنیتی مطابق الزامات مرکز مدیریت راهبردی افتا
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" always;

    # فشرده‌سازی Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream accounting_api {
        server api:3000;
        keepalive 32;
    }

    upstream accounting_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # پروکسی درخواست‌های بک‌اند API
        location /api/ {
            proxy_pass http://accounting_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # تایم‌اوت‌های گزارشات مالی حجیم
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # پروکسی فرانت‌اند Next.js و صفحات وب
        location / {
            proxy_pass http://accounting_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # مانیتورینگ سلامت سرویس
        location /health {
            proxy_pass http://accounting_api/api/v1/saas/plans;
            access_log off;
        }
    }
}
